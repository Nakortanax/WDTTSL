services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped

    pid: host

    environment:
      - TZ=Asia/Yekaterinburg
      - GLANCES_OPT=-w

    ports:
      - "192.168.1.73:61208:61208"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
