name: Build WDTTSL APK

on:
  workflow_dispatch:
  push:
    branches:
      - wdttsl-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Apply WDTTSL v4 overlay
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .wdttsl-overlay
          mkdir -p .wdttsl-overlay
          cat wdttsl-overlay-parts/part_*.b64 > /tmp/wdttsl-overlay-v4.tar.gz.b64
          echo '5a10035ca9b437e1f81c6ddcd8a7f01bbe236c857637814b9b49b10155eaf427  /tmp/wdttsl-overlay-v4.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/wdttsl-overlay-v4.tar.gz.b64 > /tmp/wdttsl-overlay-v4.tar.gz
          echo '251725cee9639fd7a5fa7ad7df92132bf1d4146ea336fec8b696ae22fbc2052e  /tmp/wdttsl-overlay-v4.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wdttsl-overlay-v4.tar.gz -C .wdttsl-overlay
          python3 .wdttsl-overlay/install_wdttsl_v4.py .

          # Overlay safety copies are not valid Android resources.
          find app/src/main/res -type f -name '*.wdttsl.bak' -print -delete

          grep -F 'rootProject.name = "WDTTSL"' settings.gradle.kts
          grep -F 'applicationId = "wdttsl.android"' app/build.gradle.kts
          grep -F 'compileSdk = 37' app/build.gradle.kts
          grep -F 'targetSdk = 37' app/build.gradle.kts
          test -z "$(find app/src/main/res -type f -name '*.wdttsl.bak' -print -quit)"

      - name: Fix generated WDTTSL Kotlin compatibility
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Compose 1.12 exposes Modifier.weight through RowScope/ColumnScope.
          # Importing the internal backing property is rejected by Kotlin 2.4.
          route = Path('app/src/main/java/com/csqtt/client/ui/RouteListsSection.kt')
          if route.exists():
              text = route.read_text(encoding='utf-8')
              text = text.replace('import androidx.compose.foundation.layout.weight\n', '')
              route.write_text(text, encoding='utf-8')

          # A lambda passed to the KeyboardActions constructor cannot use
          # return@KeyboardActions as a local return target. Give that lambda
          # an explicit label and return to the label instead.
          exceptions = Path('app/src/main/java/com/csqtt/client/ui/ExceptionsTab.kt')
          text = exceptions.read_text(encoding='utf-8')
          marker = 'return@KeyboardActions'
          if marker in text:
              marker_pos = text.index(marker)
              lambda_pos = text.rfind('onDone = {', 0, marker_pos)
              if lambda_pos < 0:
                  raise SystemExit('Found return@KeyboardActions but no preceding onDone lambda')
              text = text[:lambda_pos] + text[lambda_pos:].replace('onDone = {', 'onDone = wdttslDone@{', 1)
              text = text.replace(marker, 'return@wdttslDone')
              exceptions.write_text(text, encoding='utf-8')

          if 'return@KeyboardActions' in exceptions.read_text(encoding='utf-8'):
              raise SystemExit('Unpatched return@KeyboardActions remains')
          PY

          echo '===== ExceptionsTab around site input ====='
          nl -ba app/src/main/java/com/csqtt/client/ui/ExceptionsTab.kt | sed -n '240,275p'
          echo '===== RouteListsSection imports ====='
          nl -ba app/src/main/java/com/csqtt/client/ui/RouteListsSection.kt | sed -n '1,45p'

      # Compile and test Kotlin before the expensive 3-ABI Rust build so
      # source-level failures return quickly during stabilization.
      - name: Run Android unit tests
        id: android_tests
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest --stacktrace --console=plain --no-daemon > gradle-test.log 2>&1
          status=$?
          echo "===== LAST 500 LINES OF GRADLE TEST LOG ====="
          tail -n 500 gradle-test.log
          exit $status

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WDTTSL-gradle-diagnostics
          path: |
            gradle-test.log
            app/src/main/java/com/csqtt/client/ui/ExceptionsTab.kt
            app/src/main/java/com/csqtt/client/ui/RouteListsSection.kt
            app/src/main/java/com/csqtt/client/TunVpnService.kt
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config perl unzip
          cargo install cargo-ndk --locked

      - name: Build Rust client for Android
        shell: bash
        working-directory: rust-client
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -euxo pipefail
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          mkdir -p ../app/src/main/jniLibs/x86_64

          cargo ndk -t arm64-v8a -P 26 build --release --target-dir ../build/rust-client-android-arm64
          cp ../build/rust-client-android-arm64/aarch64-linux-android/release/client \
             ../app/src/main/jniLibs/arm64-v8a/libclient.so

          cargo ndk -t armeabi-v7a -P 26 build --release --target-dir ../build/rust-client-android-armv7
          cp ../build/rust-client-android-armv7/armv7-linux-androideabi/release/client \
             ../app/src/main/jniLibs/armeabi-v7a/libclient.so

          cargo ndk -t x86_64 -P 26 build --release --target-dir ../build/rust-client-android-x86_64
          cp ../build/rust-client-android-x86_64/x86_64-linux-android/release/client \
             ../app/src/main/jniLibs/x86_64/libclient.so

          file ../app/src/main/jniLibs/*/libclient.so

      - name: Build universal debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace --console=plain --no-daemon
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Verify universal APK native ABIs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          universal="$(find app/build/outputs/apk/debug -type f -name '*universal*debug*.apk' | head -n1)"
          test -n "$universal"
          unzip -l "$universal" | tee dist/APK-CONTENTS.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            entry="lib/$abi/libclient.so"
            unzip -l "$universal" | grep -F "$entry"
            unzip -p "$universal" "$entry" > "/tmp/libclient-$abi.so"
            test -s "/tmp/libclient-$abi.so"
            file "/tmp/libclient-$abi.so"
          done

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          find app/build/outputs/apk/debug -type f -name '*.apk' -exec cp {} dist/ \;
          universal="$(find app/build/outputs/apk/debug -type f -name '*universal*debug*.apk' | head -n1)"
          test -n "$universal"
          cp "$universal" dist/WDTTSL-universal-debug.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: WDTTSL-debug-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30
