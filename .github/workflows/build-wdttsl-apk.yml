name: Build VPNSL 1.0.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - wdttsl-build

permissions:
  contents: write

concurrency:
  group: vpnsl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Apply WDTTSL routing/mobile overlay
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .wdttsl-overlay
          mkdir -p .wdttsl-overlay
          cat wdttsl-overlay-parts/part_*.b64 > /tmp/wdttsl-overlay-v4.tar.gz.b64
          echo '5a10035ca9b437e1f81c6ddcd8a7f01bbe236c857637814b9b49b10155eaf427  /tmp/wdttsl-overlay-v4.tar.gz.b64' | sha256sum -c -
          base64 -d /tmp/wdttsl-overlay-v4.tar.gz.b64 > /tmp/wdttsl-overlay-v4.tar.gz
          echo '251725cee9639fd7a5fa7ad7df92132bf1d4146ea336fec8b696ae22fbc2052e  /tmp/wdttsl-overlay-v4.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wdttsl-overlay-v4.tar.gz -C .wdttsl-overlay
          python3 .wdttsl-overlay/install_wdttsl_v4.py .
          find app/src/main/res -type f -name '*.wdttsl.bak' -print -delete
          grep -F 'applicationId = "wdttsl.android"' app/build.gradle.kts

      - name: Apply VPNSL base customization
        shell: bash
        run: |
          set -euxo pipefail
          python3 wdttsl-custom/apply_csqtts_v1.py .

      - name: Apply VPNSL 1.0.5 features
        shell: bash
        run: |
          set -euxo pipefail
          python3 wdttsl-custom/apply_v105.py .
          route=app/src/main/java/com/csqtt/client/ui/RouteListsSection.kt
          formatter=app/src/main/java/com/csqtt/client/routing/RouteBatFormatter.kt
          test -f app/src/test/java/com/csqtt/client/routing/RouteBatFormatterTest.kt
          grep -F 'rootProject.name = "VPNSL"' settings.gradle.kts
          grep -F 'versionCode = 1005' app/build.gradle.kts
          grep -F 'versionName = "1.0.5"' app/build.gradle.kts
          grep -F '<string name="app_name">VPNSL</string>' app/src/main/res/values/strings.xml
          grep -F '1.0.5 by Sazhaev-IA' app/src/main/java/com/csqtt/client/ui/components/CsqttScreen.kt
          grep -F 'Подпись ресурса' "$route"
          grep -F 'name = label' "$route"
          grep -F 'Выгрузить все маршруты (.bat)' "$route"
          grep -F 'RouteBatFormatter.buildAllRoutesFile(profiles)' "$route"
          grep -F 'RouteSubTab.GENERATOR' "$route"
          grep -F 'Генератор BAT по имени сайта' "$route"
          grep -F 'InetAddress.getAllByName(host)' "$route"
          grep -F 'filterIsInstance<Inet4Address>()' "$route"
          grep -F 'MediaStore.Downloads.EXTERNAL_CONTENT_URI' "$route"
          grep -F 'Environment.DIRECTORY_DOWNLOADS' "$route"
          grep -F 'RouteBatFormatter.buildSiteRoutesFile(host, generatedIpv4)' "$route"
          grep -F 'AlertDialog(' "$route"
          grep -F 'RadioButton(' "$route"
          grep -F 'Switch(' "$route"
          grep -F 'HorizontalDivider(' "$route"
          grep -F 'route add ${parts[0]} mask ${prefixToMask(prefix)} 0.0.0.0' "$formatter"
          grep -F 'RouteListsSection(Modifier.fillMaxWidth().weight(1f))' app/src/main/java/com/csqtt/client/ui/ExceptionsTab.kt
          grep -F 'if (selectedTab == 3) return@pointerInput' app/src/main/java/com/csqtt/client/MainActivity.kt
          if grep -Eq '(^|[^A-Za-z])Card\(' "$route"; then
            echo 'Per-route Card returned in 1.0.5 UI' >&2
            exit 1
          fi
          if grep -F 'CsqttSegmentedControl' "$route"; then
            echo 'Large segmented network selector returned in 1.0.5 UI' >&2
            exit 1
          fi

      - name: Run Android unit tests
        id: android_tests
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest --stacktrace --console=plain --no-daemon > gradle-test.log 2>&1
          status=$?
          echo "===== LAST 500 LINES OF GRADLE TEST LOG ====="
          tail -n 500 gradle-test.log
          exit $status

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VPNSL-1.0.5-gradle-diagnostics
          path: |
            gradle-test.log
            app/src/main/java/com/csqtt/client/MainActivity.kt
            app/src/main/java/com/csqtt/client/ui/ExceptionsTab.kt
            app/src/main/java/com/csqtt/client/ui/RouteListsSection.kt
            app/src/main/java/com/csqtt/client/routing/RouteBatFormatter.kt
            app/src/test/java/com/csqtt/client/routing/RouteBatFormatterTest.kt
            app/src/main/java/com/csqtt/client/TunVpnService.kt
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config perl unzip
          cargo install cargo-ndk --locked

      - name: Build Rust client for Android
        shell: bash
        working-directory: rust-client
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -euxo pipefail
          mkdir -p ../app/src/main/jniLibs/arm64-v8a ../app/src/main/jniLibs/armeabi-v7a ../app/src/main/jniLibs/x86_64
          cargo ndk -t arm64-v8a -P 26 build --release --target-dir ../build/rust-client-android-arm64
          cp ../build/rust-client-android-arm64/aarch64-linux-android/release/client ../app/src/main/jniLibs/arm64-v8a/libclient.so
          cargo ndk -t armeabi-v7a -P 26 build --release --target-dir ../build/rust-client-android-armv7
          cp ../build/rust-client-android-armv7/armv7-linux-androideabi/release/client ../app/src/main/jniLibs/armeabi-v7a/libclient.so
          cargo ndk -t x86_64 -P 26 build --release --target-dir ../build/rust-client-android-x86_64
          cp ../build/rust-client-android-x86_64/x86_64-linux-android/release/client ../app/src/main/jniLibs/x86_64/libclient.so
          file ../app/src/main/jniLibs/*/libclient.so

      - name: Build debug APKs
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace --console=plain --no-daemon
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Verify universal APK native ABIs
        shell: bash
        run: |
          set -euxo pipefail
          universal="$(find app/build/outputs/apk/debug -type f -name '*universal*debug*.apk' | head -n1)"
          test -n "$universal"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            entry="lib/$abi/libclient.so"
            unzip -l "$universal" | grep -F "$entry"
            unzip -p "$universal" "$entry" > "/tmp/libclient-$abi.so"
            test -s "/tmp/libclient-$abi.so"
            file "/tmp/libclient-$abi.so"
          done

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist
          arm64="$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*debug*.apk' | head -n1)"
          armv7="$(find app/build/outputs/apk/debug -type f -name '*armeabi-v7a*debug*.apk' | head -n1)"
          x86="$(find app/build/outputs/apk/debug -type f -name '*x86_64*debug*.apk' | head -n1)"
          universal="$(find app/build/outputs/apk/debug -type f -name '*universal*debug*.apk' | head -n1)"
          test -n "$arm64" && test -n "$armv7" && test -n "$x86" && test -n "$universal"
          cp "$arm64" dist/VPNSL-1.0.5-arm64-v8a.apk
          cp "$armv7" dist/VPNSL-1.0.5-armeabi-v7a.apk
          cp "$x86" dist/VPNSL-1.0.5-x86_64.apk
          cp "$universal" dist/VPNSL-1.0.5-universal.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPNSL-1.0.5-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release 1.0.5
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Release VPNSL 1.0.5')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          VPNSL 1.0.5

          Изменения:
          - добавлен экспорт всех сохранённых IP/CIDR маршрутов в один .bat файл;
          - BAT содержит обычные route add строки, а подпись, активность и выбранная сеть сохраняются в REM-комментариях;
          - для ручного добавления IPv4/CIDR добавлено обязательное поле «Подпись ресурса»;
          - в списке для одиночного маршрута отображаются и подпись, и сам IPv4/CIDR;
          - добавлена вкладка «Генератор»: ввод домена/URL, поиск текущих IPv4 (A-записей), формирование .bat;
          - на Android 10+ сгенерированный .bat сохраняется напрямую в папку Download, на Android 8–9 используется системный диалог сохранения;
          - добавлены unit tests преобразования CIDR в netmask/route add и генерации BAT;
          - сохранены компактный выбор сети, активация маршрутов, импорт файлов, mobile-only и совместимость с сервером CSQTT 2.1.9 / WIRE-3.
          EOF

          if gh release view v1.0.5 >/dev/null 2>&1; then
            gh release upload v1.0.5 dist/VPNSL-1.0.5-*.apk dist/SHA256SUMS.txt --clobber
            gh release edit v1.0.5 --title "VPNSL 1.0.5" --notes-file /tmp/release-notes.md
          else
            gh release create v1.0.5 \
              dist/VPNSL-1.0.5-*.apk \
              dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "VPNSL 1.0.5" \
              --notes-file /tmp/release-notes.md
          fi
