name: Build and Release VPNSL 1.0.2 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - windows-v1.0.8
    paths:
      - 'windows-client/**'
      - 'rust-client/**'
      - '.github/workflows/build-windows-v108-fast.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: vpnsl-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout final Windows source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Verify Wi-Fi pause logic is absent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = (Get-Content windows-client/VpnEngine.cs -Raw) + "`n" +
                     (Get-Content windows-client/MainWindow.xaml.cs -Raw) + "`n" +
                     (Get-Content windows-client/AppSettings.cs -Raw) + "`n" +
                     (Get-Content windows-client/MainWindow.xaml -Raw)
          foreach ($forbidden in @('MonitorWifiAutoPauseAsync','IsWifiConnected','"PAUSE"','"RESUME"','_wifiMonitorTask','_pausedForWifi','AutoPauseOnWifi','Автопауза при Wi-Fi')) {
            if ($sources.Contains($forbidden)) { throw "Forbidden Wi-Fi pause code remains: $forbidden" }
          }

      - name: Verify Windows 1.0.2 full-tunnel transport fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-Content windows-client/VPNSL.Windows.csproj -Raw
          $xaml = Get-Content windows-client/MainWindow.xaml -Raw
          $installer = Get-Content windows-client/installer.iss -Raw
          $engine = Get-Content windows-client/VpnEngine.cs -Raw
          $wintun = Get-Content windows-client/Wintun.cs -Raw
          if (-not $project.Contains('<Version>1.0.2</Version>')) { throw 'Project version is not 1.0.2' }
          if (-not $xaml.Contains('Windows • 1.0.2')) { throw 'UI version is not 1.0.2' }
          if (-not $installer.Contains('#define MyAppVersion "1.0.2"')) { throw 'Installer version is not 1.0.2' }
          foreach ($required in @('0.0.0.0/1','128.0.0.0/1','WaitForTransportDiscoveryAsync','TurnCredentialMarker','VerifyFullTunnelRoutesAsync','FULL_TUNNEL_OK')) {
            if (-not $engine.Contains($required)) { throw "Missing full-tunnel safety marker: $required" }
          }
          foreach ($required in @('TunToClientPackets','ClientToTunPackets','Первый исходящий IP-пакет','Первый входящий IP-пакет')) {
            if (-not $wintun.Contains($required)) { throw "Missing Wintun bridge diagnostic marker: $required" }
          }

      - name: Build and smoke-test Windows UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish windows-client/VPNSL.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o build/windows-ui

          $exe = (Resolve-Path 'build/windows-ui/VPNSL.Windows.exe').Path
          foreach ($required in @('VPNSL.Windows.exe','VPNSL.Windows.dll','coreclr.dll')) {
            if (-not (Test-Path "build/windows-ui/$required")) { throw "Windows UI output missing: $required" }
          }

          $exeText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if (-not $exeText.Contains('requestedExecutionLevel level="asInvoker"')) {
            throw 'VPNSL.Windows.exe does not contain the required asInvoker manifest'
          }

          $marker = Join-Path $env:RUNNER_TEMP 'vpnsl-publish-basic-smoke.ok'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:VPNSL_STARTUP_SMOKE_MARKER = $marker
          $p = Start-Process -FilePath $exe -ArgumentList '--startup-smoke-test' -WorkingDirectory (Resolve-Path 'build/windows-ui').Path -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Published basic smoke test failed' }

          $marker = Join-Path $env:RUNNER_TEMP 'vpnsl-publish-wpf-smoke.ok'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:VPNSL_STARTUP_SMOKE_MARKER = $marker
          $p = Start-Process -FilePath $exe -ArgumentList '--wpf-smoke-test' -WorkingDirectory (Resolve-Path 'build/windows-ui').Path -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Published WPF/XAML smoke test failed' }

      - name: Build VPNSL Rust client with static CRT
        shell: pwsh
        working-directory: rust-client
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --target x86_64-pc-windows-msvc
          $client = 'target/x86_64-pc-windows-msvc/release/client.exe'
          if (-not (Test-Path $client)) { throw 'client.exe was not built' }
          $clientText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($client))
          if ($clientText -match 'VCRUNTIME140\.dll') { throw 'client.exe still depends on VCRUNTIME140.dll' }
          Get-FileHash $client -Algorithm SHA256 | Format-List

      - name: Download verified server-assets baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT_ID: '10086607313'
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:BASELINE_ARTIFACT_ID/zip"
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile baseline-artifact.zip -MaximumRedirection 10
          Expand-Archive baseline-artifact.zip -DestinationPath baseline-artifact -Force
          $portable = 'baseline-artifact/VPNSL-1.0.8-Windows-x64.zip'
          if (-not (Test-Path $portable)) { throw 'Verified baseline portable package is missing' }
          Expand-Archive $portable -DestinationPath baseline-portable -Force
          if (-not (Test-Path 'baseline-portable/VPNSL-1.0.8-Windows-x64/wintun.dll')) { throw 'Baseline wintun.dll missing' }
          foreach ($name in @('csqtt-linux-amd64','csqtt-linux-arm64','csqtt-linux-armv7','deploy.sh')) {
            if (-not (Test-Path "baseline-portable/VPNSL-1.0.8-Windows-x64/server-assets/$name")) { throw "Baseline server asset missing: $name" }
          }

      - name: Assemble and smoke-test portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'dist/VPNSL-1.0.2-Windows-x64'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'baseline-portable/VPNSL-1.0.8-Windows-x64' $package -Recurse -Force
          Copy-Item 'build/windows-ui/*' $package -Recurse -Force
          Copy-Item rust-client/target/x86_64-pc-windows-msvc/release/client.exe "$package/client.exe" -Force
          Copy-Item windows-client/README.md "$package/README-WINDOWS.txt" -Force
          Remove-Item "$package/SHA256SUMS.txt" -Force -ErrorAction SilentlyContinue

          foreach ($required in @('VPNSL.Windows.exe','VPNSL.Windows.dll','VPNSL.Windows.runtimeconfig.json','coreclr.dll','hostfxr.dll','client.exe','wintun.dll')) {
            if (-not (Test-Path "$package/$required")) { throw "Portable package missing: $required" }
          }

          $marker = Join-Path $env:RUNNER_TEMP 'vpnsl-portable-wpf-smoke.ok'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:VPNSL_STARTUP_SMOKE_MARKER = $marker
          $portableExe = (Resolve-Path "$package/VPNSL.Windows.exe").Path
          $p = Start-Process -FilePath $portableExe -ArgumentList '--wpf-smoke-test' -WorkingDirectory (Resolve-Path $package).Path -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Portable WPF/XAML smoke test failed' }

          Get-ChildItem $package -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = $_.FullName.Substring((Resolve-Path $package).Path.Length + 1).Replace('\','/')
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
            } | Set-Content "$package/SHA256SUMS.txt"
          Compress-Archive -Path $package -DestinationPath dist/VPNSL-1.0.2-Windows-x64.zip -Force

      - name: Build final Windows installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found' }
          & $iscc windows-client/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $installer = 'dist/VPNSL-1.0.2-Windows-x64-Setup.exe'
          if (-not (Test-Path $installer)) { throw 'Installer EXE was not built' }
          Get-FileHash $installer -Algorithm SHA256 | Format-List

      - name: Upload final Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VPNSL-1.0.2-Windows-x64
          path: |
            dist/VPNSL-1.0.2-Windows-x64.zip
            dist/VPNSL-1.0.2-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release windows-v1.0.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'windows-v1.0.2'
          $setup = 'dist/VPNSL-1.0.2-Windows-x64-Setup.exe'
          $portable = 'dist/VPNSL-1.0.2-Windows-x64.zip'
          $notes = @'
          VPNSL Windows 1.0.2 — исправление full-tunnel.

          - Исправлена гонка включения full-tunnel: split-default больше не включается до обнаружения TURN-транспорта.
          - TURN-адреса заранее получают физические /32 маршруты, поэтому транспорт VPNSL не попадает обратно в собственный Wintun.
          - Ошибки New-NetRoute больше не игнорируются; каждый маршрут проверяется после установки.
          - Split-default 0.0.0.0/1 и 128.0.0.0/1 отдельно проверяются в таблице Windows.
          - Добавлена диагностика моста Wintun: первый пакет в client.exe, первый пакет обратно и контроль двустороннего обмена.
          - «Напрямую» остаётся исключением из full-tunnel, «Через VPNSL» — явным закреплением за VPN.
          - Wi-Fi/Ethernet не блокируют VPN.
          - Windows 10/11 x64, self-contained .NET 8.
          '@

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update Windows 1.0.2 release assets' }
            gh release edit $tag --title 'VPNSL Windows 1.0.2' --notes $notes --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update Windows 1.0.2 release metadata' }
          } else {
            gh release create $tag $setup $portable --target $env:GITHUB_SHA --title 'VPNSL Windows 1.0.2' --notes $notes --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create Windows 1.0.2 release' }
          }
