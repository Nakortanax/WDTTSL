name: Build VPNSL Windows Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - windows-v1.0.3-server-deploy-fix
    paths:
      - 'windows-client/**'
      - 'rust-client/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: vpnsl-windows-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  VPNSL_VERSION: '1.0.3'
  VPNSL_TAG: 'windows-v1.0.3'
  VPNSL_PACKAGE: 'VPNSL-1.0.3-Windows-x64'
  VPNSL_BASELINE_TAG: 'windows-v1.0.2'
  VPNSL_BASELINE_PACKAGE: 'VPNSL-1.0.2-Windows-x64'

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Windows source
        uses: actions/checkout@v4

      - name: Set candidate version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VPNSL_VERSION
          $package = $env:VPNSL_PACKAGE

          $projectPath = 'windows-client/VPNSL.Windows.csproj'
          $project = Get-Content $projectPath -Raw
          $project = [regex]::Replace($project, '<Version>[^<]+</Version>', "<Version>$version</Version>")
          $project = [regex]::Replace($project, '<FileVersion>[^<]+</FileVersion>', "<FileVersion>$version.0</FileVersion>")
          [IO.File]::WriteAllText($projectPath, $project, [Text.UTF8Encoding]::new($false))

          $xamlPath = 'windows-client/MainWindow.xaml'
          $xaml = Get-Content $xamlPath -Raw
          $xaml = [regex]::Replace($xaml, 'Title="VPNSL [0-9.]+"', "Title=`"VPNSL $version`"")
          $xaml = [regex]::Replace($xaml, 'Text="VPNSL [0-9.]+" FontSize="21"', "Text=`"VPNSL $version`" FontSize=`"21`"")
          $xaml = [regex]::Replace($xaml, 'Text="Версия [0-9.]+"', "Text=`"Версия $version`"")
          [IO.File]::WriteAllText($xamlPath, $xaml, [Text.UTF8Encoding]::new($false))

          $installerPath = 'windows-client/installer.iss'
          $installer = Get-Content $installerPath -Raw
          $installer = [regex]::Replace($installer, '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`"")
          $installer = [regex]::Replace($installer, 'OutputBaseFilename=VPNSL-[0-9.]+-Windows-x64-Setup', "OutputBaseFilename=$package-Setup")
          $installer = [regex]::Replace($installer, 'Source: "\.\.\\dist\\VPNSL-[0-9.]+-Windows-x64\\\*"', "Source: `"..\dist\$package\*`"")
          [IO.File]::WriteAllText($installerPath, $installer, [Text.UTF8Encoding]::new($false))

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Verify Windows 1.0.3 UI, routing and server deploy hardening
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-Content windows-client/VPNSL.Windows.csproj -Raw
          $xaml = Get-Content windows-client/MainWindow.xaml -Raw
          $patch = Get-Content windows-client/patch-vpnengine-routing.ps1 -Raw
          $deploy = Get-Content windows-client/ServerDeployService.cs -Raw
          if (-not $project.Contains('<Version>1.0.3</Version>')) { throw 'Project version is not 1.0.3' }
          if (-not $xaml.Contains('Text="VPNSL 1.0.3"')) { throw 'Header version is not 1.0.3' }
          foreach ($required in @('DEFAULT_TUNNEL_OK','InstallSplitDefaultWithNetshAsync','InstallDefaultRouteWithNetshAsync','VerifyAndReassertDirectRoutesAsync','TryInferDirectProfileHost','LIVE-DNS','DIRECT_OK')) {
            if (-not $patch.Contains($required)) { throw "Missing routing fix marker: $required" }
          }
          foreach ($required in @('UploadShellScriptAsync','NormalizeDeployShellScript','bash -n /tmp/deploy.sh',"sed -i 's/\\r$//' /tmp/deploy.sh",'GetAttributes(remotePath).Size','deploy.sh нормализован и проверен через bash -n')) {
            if (-not $deploy.Contains($required)) { throw "Missing server deploy hardening marker: $required" }
          }

      - name: Build and smoke-test Windows UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish windows-client/VPNSL.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o build/windows-ui
          foreach ($required in @('VPNSL.Windows.exe','VPNSL.Windows.dll','coreclr.dll')) {
            if (-not (Test-Path "build/windows-ui/$required")) { throw "Windows UI output missing: $required" }
          }
          $marker = Join-Path $env:RUNNER_TEMP 'vpnsl-wpf-smoke.ok'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:VPNSL_STARTUP_SMOKE_MARKER = $marker
          $exe = (Resolve-Path 'build/windows-ui/VPNSL.Windows.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--wpf-smoke-test' -WorkingDirectory (Resolve-Path 'build/windows-ui').Path -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Published WPF smoke test failed' }

      - name: Build VPNSL Rust client
        shell: pwsh
        working-directory: rust-client
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --target x86_64-pc-windows-msvc
          $client = 'target/x86_64-pc-windows-msvc/release/client.exe'
          if (-not (Test-Path $client)) { throw 'client.exe was not built' }
          $clientText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($client))
          if ($clientText -match 'VCRUNTIME140\.dll') { throw 'client.exe depends on VCRUNTIME140.dll' }

      - name: Download stable 1.0.2 baseline assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path baseline-download | Out-Null
          gh release download $env:VPNSL_BASELINE_TAG --repo $env:GITHUB_REPOSITORY --pattern "$env:VPNSL_BASELINE_PACKAGE.zip" --dir baseline-download
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download stable Windows 1.0.2 baseline' }
          $portable = "baseline-download/$env:VPNSL_BASELINE_PACKAGE.zip"
          if (-not (Test-Path $portable)) { throw 'Stable baseline portable package is missing' }
          Expand-Archive $portable -DestinationPath baseline-portable -Force
          $root = "baseline-portable/$env:VPNSL_BASELINE_PACKAGE"
          if (-not (Test-Path "$root/wintun.dll")) { throw 'Baseline wintun.dll missing' }
          foreach ($name in @('csqtt-linux-amd64','csqtt-linux-arm64','csqtt-linux-armv7','deploy.sh')) {
            if (-not (Test-Path "$root/server-assets/$name")) { throw "Baseline server asset missing: $name" }
          }

      - name: Assemble and smoke-test candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "dist/$env:VPNSL_PACKAGE"
          $baseline = "baseline-portable/$env:VPNSL_BASELINE_PACKAGE"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $baseline $package -Recurse -Force
          Copy-Item 'build/windows-ui/*' $package -Recurse -Force
          Copy-Item rust-client/target/x86_64-pc-windows-msvc/release/client.exe "$package/client.exe" -Force
          Copy-Item windows-client/README.md "$package/README-WINDOWS.txt" -Force

          # Normalize the bundled Linux installer inside the final Windows package too.
          $deployPath = "$package/server-assets/deploy.sh"
          if (-not (Test-Path $deployPath)) { throw 'server-assets/deploy.sh is missing' }
          $deployText = [IO.File]::ReadAllText($deployPath)
          $deployText = $deployText.TrimStart([char]0xFEFF).Replace("`r`n", "`n").Replace("`r", "`n")
          if (-not $deployText.StartsWith('#!/')) { throw 'server-assets/deploy.sh has invalid shebang' }
          [IO.File]::WriteAllText($deployPath, $deployText, [Text.UTF8Encoding]::new($false))
          $deployBytes = [IO.File]::ReadAllBytes($deployPath)
          if ($deployBytes -contains 13) { throw 'server-assets/deploy.sh still contains CR after normalization' }
          if ($deployBytes.Length -ge 3 -and $deployBytes[0] -eq 0xEF -and $deployBytes[1] -eq 0xBB -and $deployBytes[2] -eq 0xBF) {
            throw 'server-assets/deploy.sh still contains UTF-8 BOM'
          }
          foreach ($serverAsset in @('csqtt-linux-amd64','csqtt-linux-arm64','csqtt-linux-armv7')) {
            $serverPath = "$package/server-assets/$serverAsset"
            if (-not (Test-Path $serverPath)) { throw "Server asset missing: $serverAsset" }
            if ((Get-Item $serverPath).Length -lt 1000000) { throw "Server asset is unexpectedly small: $serverAsset" }
          }

          Remove-Item "$package/SHA256SUMS.txt" -Force -ErrorAction SilentlyContinue
          foreach ($required in @('VPNSL.Windows.exe','VPNSL.Windows.dll','VPNSL.Windows.runtimeconfig.json','coreclr.dll','hostfxr.dll','client.exe','wintun.dll')) {
            if (-not (Test-Path "$package/$required")) { throw "Candidate package missing: $required" }
          }
          $marker = Join-Path $env:RUNNER_TEMP 'vpnsl-portable-smoke.ok'
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:VPNSL_STARTUP_SMOKE_MARKER = $marker
          $exe = (Resolve-Path "$package/VPNSL.Windows.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList '--wpf-smoke-test' -WorkingDirectory (Resolve-Path $package).Path -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Candidate WPF smoke test failed' }
          Get-ChildItem $package -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path $package).Path.Length + 1).Replace('\','/')
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
          } | Set-Content "$package/SHA256SUMS.txt"
          Compress-Archive -Path $package -DestinationPath "dist/$env:VPNSL_PACKAGE.zip" -Force

      - name: Build candidate installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found' }
          & $iscc windows-client/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (-not (Test-Path "dist/$env:VPNSL_PACKAGE-Setup.exe")) { throw 'Candidate installer was not built' }

      - name: Upload Windows 1.0.3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: VPNSL-1.0.3-Windows-x64-candidate
          path: |
            dist/VPNSL-1.0.3-Windows-x64.zip
            dist/VPNSL-1.0.3-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Remove legacy Windows releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $repo = $env:GITHUB_REPOSITORY
          $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases) {
            $tag = [string]$release.tag_name
            if ($tag -in @('windows-v1.0.0','windows-v1.0.1','windows-v1.0.2','windows-v1.0.3')) { continue }
            $windowsAssets = @($release.assets | Where-Object { $_.name -match 'Windows-x64' })
            if ($windowsAssets.Count -gt 0) {
              Write-Host "Deleting legacy Windows release $tag"
              gh release delete $tag --cleanup-tag --yes --repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete legacy Windows release $tag" }
            }
          }

      - name: Delete obsolete Windows build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $rows = @(gh api "repos/$repo/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | [.id,.name,.workflow_run.id] | @tsv')
          foreach ($row in $rows) {
            $parts = $row -split "`t"
            if ($parts.Count -lt 3) { continue }
            $id = $parts[0]
            $name = $parts[1]
            $runId = $parts[2]
            if ($name -match '^VPNSL-.*Windows-x64' -and $runId -ne $env:GITHUB_RUN_ID) {
              gh api --method DELETE "repos/$repo/actions/artifacts/$id"
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete artifact $id" }
            }
          }

      - name: Publish Windows 1.0.3 when approved
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $approved = (Get-Content windows-client/RELEASE_VERSION.txt -Raw).Trim()
          if ($approved -ne $env:VPNSL_VERSION) {
            Write-Host "Candidate only: RELEASE_VERSION.txt=$approved; official release remains Windows 1.0.2"
            exit 0
          }
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:VPNSL_TAG
          $setup = "dist/$env:VPNSL_PACKAGE-Setup.exe"
          $portable = "dist/$env:VPNSL_PACKAGE.zip"
          $notes = 'VPNSL Windows 1.0.3 — исправлена установка и переустановка Linux-сервера: deploy.sh нормализуется CRLF/CR→LF без BOM, после SFTP выполняется удалённая проверка bash -n до установки, загрузки проверяются по размеру, а deploy.sh внутри готового Windows-пакета дополнительно нормализуется и проверяется. Маршрутизация Windows 1.0.2 сохранена.'
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $portable --clobber --repo $repo
            gh release edit $tag --title 'VPNSL Windows 1.0.3' --notes $notes --repo $repo
          } else {
            gh release create $tag $setup $portable --target $env:GITHUB_SHA --title 'VPNSL Windows 1.0.2' --notes $notes --repo $repo
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish Windows 1.0.3' }