name: Inspect VPNSL 1.0.5 generated routing

on:
  push:
    branches:
      - wdttsl-build

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact 1.0.5 overlays
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .wdttsl-overlay
          mkdir -p .wdttsl-overlay
          cat wdttsl-overlay-parts/part_*.b64 > /tmp/wdttsl-overlay-v4.tar.gz.b64
          base64 -d /tmp/wdttsl-overlay-v4.tar.gz.b64 > /tmp/wdttsl-overlay-v4.tar.gz
          tar -xzf /tmp/wdttsl-overlay-v4.tar.gz -C .wdttsl-overlay
          python3 .wdttsl-overlay/install_wdttsl_v4.py .
          python3 wdttsl-custom/apply_csqtts_v1.py .
          python3 wdttsl-custom/apply_v105.py .
      - name: Publish generated source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B v105-generated-inspect
          git add -f app/src/main/java/com/csqtt/client app/src/main/res app/build.gradle.kts settings.gradle.kts
          git commit -m "Generated VPNSL 1.0.5 routing snapshot"
          git push --force origin HEAD:refs/heads/v105-generated-inspect
