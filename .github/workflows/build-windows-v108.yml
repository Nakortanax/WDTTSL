name: Build VPNSL 1.0.8 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - windows-v1.0.8
    paths:
      - 'windows-client/**'
      - 'rust-client/**'
      - 'rust-server/**'
      - 'shared/**'
      - 'scripts/server_asset_provenance.ps1'
      - '.github/workflows/build-windows-v108.yml'

permissions:
  contents: read

concurrency:
  group: vpnsl-windows-108-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout VPNSL 1.0.8 Windows branch
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-client -> rust-client/target
            rust-server -> build/csqtt-uring-linux
          cache-on-failure: true

      - name: Build existing VPNSL Rust client for Windows
        shell: pwsh
        working-directory: rust-client
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --target x86_64-pc-windows-msvc
          if (-not (Test-Path target/x86_64-pc-windows-msvc/release/client.exe)) { throw 'client.exe was not built' }

      - name: Download official signed Wintun 0.14.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') {
            throw "Wintun checksum mismatch: $hash"
          }
          Expand-Archive wintun.zip -DestinationPath .wintun -Force
          if (-not (Test-Path .wintun/wintun/bin/amd64/wintun.dll)) { throw 'wintun.dll was not extracted' }

      - name: Install Linux cross-build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command zig -ErrorAction SilentlyContinue)) {
            choco install zig --yes --no-progress
          }
          zig version
          if (-not (Get-Command cargo-zigbuild -ErrorAction SilentlyContinue)) {
            cargo install cargo-zigbuild --locked
          }
          cargo zigbuild --help | Select-Object -First 5
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl
          rustup target add armv7-unknown-linux-musleabihf

      - name: Build exact VPNSL 1.0.8 server binaries sequentially
        shell: cmd
        working-directory: rust-server
        run: |
          call build_linux.bat --build-variant x86_64-unknown-linux-musl csqtt-linux-amd64
          if errorlevel 1 exit /b 1
          call build_linux.bat --build-variant aarch64-unknown-linux-musl csqtt-linux-arm64
          if errorlevel 1 exit /b 1
          call build_linux.bat --build-variant armv7-unknown-linux-musleabihf csqtt-linux-armv7
          if errorlevel 1 exit /b 1

      - name: Verify server assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/server_asset_provenance.ps1 -Mode Write
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/server_asset_provenance.ps1 -Mode Verify

      - name: Collect server assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/server-assets | Out-Null
          Copy-Item app/src/main/assets/deploy.sh build/server-assets/deploy.sh
          foreach ($name in @('csqtt-linux-amd64','csqtt-linux-arm64','csqtt-linux-armv7')) {
            $source = Join-Path 'app/src/main/assets' $name
            if (-not (Test-Path $source)) { throw "Server build did not produce: $name" }
            if ((Get-Item $source).Length -le 0) { throw "Server binary is empty: $name" }
            Copy-Item $source build/server-assets/$name
          }
          Get-FileHash build/server-assets/* -Algorithm SHA256 | Format-Table -AutoSize

      - name: Build Windows UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish windows-client/VPNSL.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o build/windows-ui
          if (-not (Test-Path build/windows-ui/VPNSL.Windows.exe)) { throw 'VPNSL.Windows.exe was not built' }

      - name: Prepare portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'dist/VPNSL-1.0.8-Windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          New-Item -ItemType Directory -Force -Path "$package/server-assets" | Out-Null
          Copy-Item build/windows-ui/VPNSL.Windows.exe $package/
          Copy-Item rust-client/target/x86_64-pc-windows-msvc/release/client.exe $package/
          Copy-Item .wintun/wintun/bin/amd64/wintun.dll $package/
          Copy-Item build/server-assets/* "$package/server-assets/"
          Copy-Item windows-client/README.md $package/
          Get-ChildItem $package -File -Recurse |
            ForEach-Object {
              $relative = $_.FullName.Substring((Resolve-Path $package).Path.Length + 1).Replace('\','/')
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
            } | Set-Content "$package/SHA256SUMS.txt"
          Compress-Archive -Path $package -DestinationPath dist/VPNSL-1.0.8-Windows-x64.zip -Force

      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found' }
          & $iscc windows-client/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (-not (Test-Path dist/VPNSL-1.0.8-Windows-x64-Setup.exe)) { throw 'Installer EXE was not built' }
          Get-FileHash dist/VPNSL-1.0.8-Windows-x64-Setup.exe -Algorithm SHA256 | Format-List

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VPNSL-1.0.8-Windows-x64
          path: |
            dist/VPNSL-1.0.8-Windows-x64.zip
            dist/VPNSL-1.0.8-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
