services:
  ollama:
    image: ollama/ollama:latest
    container_name: server-ai-ollama
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${SERVER_AI_DATA_DIR:-/var/lib/server-ai}/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
