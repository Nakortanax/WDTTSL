services:
  ollama:
    image: ollama/ollama:latest
    container_name: server-ai-ollama
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-8192}"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${SERVER_AI_DATA_DIR:-/var/lib/server-ai}/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  agent:
    build:
      context: ./agent
    container_name: server-ai-agent
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      AGENT_DB_PATH: /data/agent.db
    ports:
      - "${AGENT_BIND_IP:-192.168.1.73}:8092:8092"
    volumes:
      - ${SERVER_AI_DATA_DIR:-/var/lib/server-ai}/agent:/data
    user: "${SERVER_AI_UID:-1000}:${SERVER_AI_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
