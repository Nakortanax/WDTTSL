use_default_settings: true

general:
  debug: false
  instance_name: "Server AI Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  # Overridden at runtime by SEARXNG_SECRET from server-ai/.env.
  secret_key: "change-me-via-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false

ui:
  default_locale: "ru"
